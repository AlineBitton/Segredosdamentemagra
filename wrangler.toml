# O projeto na Cloudflare é um Worker (o painel roda `npx wrangler deploy`),
# e não um projeto de Pages. Antes este arquivo trazia `pages_build_output_dir`,
# que é configuração de Pages: o build passava e o deploy falhava, porque
# `wrangler deploy` não sabe o que fazer com um projeto de Pages.
#
# `name` precisa bater com o nome do Worker no painel, senão o deploy cria um
# segundo Worker em vez de atualizar este. O projeto conectado ao GitHub é o
# `smm` — o mesmo nome do subdomínio onde o site mora.
name = "smm"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Os arquivos estáticos do build viram parte do Worker. A ligação ASSETS é
# como o código busca cada um deles, e ela continua aplicando o _headers.
[assets]
directory = "./dist"
binding = "ASSETS"
# O Worker atende primeiro: é ele que resolve o lote e a variante de promessa
# no HTML. Sem isto, a Cloudflare devolveria o arquivo estático direto e a
# página iria ao ar congelada no lote da hora do build.
run_worker_first = true

# O domínio deixa de ser um passo manual no painel. Com `custom_domain = true`
# o `wrangler deploy` cria (ou reaponta) o registro de DNS e emite o
# certificado a cada publicação, e falha alto se o nome estiver preso em outro
# Worker ou num projeto de Pages — que é o modo silencioso de o site sumir do
# ar. Um custom domain de Worker tem certificado próprio, do nome exato, então
# `www.smm` (segundo nível de subdomínio) também fica coberto — o que o
# certificado Universal da zona, que só cobre um nível, não faria.
#
# Os dois nomes ficam declarados porque os dois já estão divulgados. Quem
# entrar por um ou por outro cai no mesmo Worker.
[[routes]]
pattern = "smm.afinandocorpoemente.com.br"
custom_domain = true

[[routes]]
pattern = "www.smm.afinandocorpoemente.com.br"
custom_domain = true
